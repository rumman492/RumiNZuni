# Requires POSTGRES_PASSWORD and PAYLOAD_SECRET in .env. The app refuses to boot in
# production if those values are missing, short, or match documented examples.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ruminzuni
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ruminzuni
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ruminzuni -d ruminzuni']
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://ruminzuni:${POSTGRES_PASSWORD}@postgres:5432/ruminzuni
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://ruminzuni.com
      PAYLOAD_DB_PUSH: ${PAYLOAD_DB_PUSH:-true}
    volumes:
      - ./media:/app/media

  seed:
    profiles: ['seed']
    build:
      context: .
      dockerfile: Dockerfile.seed
    env_file:
      - .env
    environment:
      NODE_ENV: production
      SEED_CATALOG: 'true'
      DATABASE_URL: postgresql://ruminzuni:${POSTGRES_PASSWORD}@postgres:5432/ruminzuni
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      NEXT_PUBLIC_SERVER_URL: https://ruminzuni.com
    volumes:
      - ./media:/app/media
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
